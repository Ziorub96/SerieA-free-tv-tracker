name: Update Serie A Free TV

on:
  schedule:
    # Ogni 6 ore (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Attiva debug mode (log dettagliato)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "0"

# Permessi per pushare i file aggiornati
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Installa dipendenze Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Installa browser Playwright (Chromium + dipendenze di sistema)
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 5. Esegui il tracker
      - name: Run tracker
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          DEBUG_SCRAPERS: ${{ github.event.inputs.debug || '1' }}
        run: python main.py

      # 6. Mostra un'anteprima del report (utile nei log)
      - name: Show report preview
        if: always()
        run: |
          echo "===== data/report.json (primi 100 righe) ====="
          head -n 100 data/report.json || true
          echo ""
          echo "===== output/report.md ====="
          cat output/report.md || true

      # 7. Commit e push (solo se ci sono modifiche)
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi

          git commit -m "chore: update report [skip ci]"
          git push