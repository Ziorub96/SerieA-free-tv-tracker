name: Update Serie A Free TV

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il tracker
        run: python main.py

      - name: Commit dei report aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report.json output/report.md
          git diff --cached --quiet && echo "Nessuna modifica da committare" && exit 0
          git commit -m "chore: aggiorna report Serie A Free TV"
          git push
